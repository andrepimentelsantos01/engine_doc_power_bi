[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engine-doc-power-bi"
version = "0.1.0"
description = "Automatic technical documentation for Power BI PBIP projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Engine Doc Power BI contributors" }]
keywords = ["power-bi", "pbip", "tmdl", "lineage", "documentation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = ["requests>=2.31,<3"]

[project.urls]
Homepage = "https://github.com/andrepimentelsantos01/engine_doc_power_bi"
Repository = "https://github.com/andrepimentelsantos01/engine_doc_power_bi"
Issues = "https://github.com/andrepimentelsantos01/engine_doc_power_bi/issues"

[project.scripts]
engine-doc-power-bi = "engine_doc.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
